<!DOCTYPE html>
<html>
<head>
  <title>Lab 9 - Formatted</title>

  <style>
    form {
         padding: 10px;
    }

    input, select, textarea {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <form>
    First Name: <input type="text"><br><br>
    Last Name: <input type="text"><br><br>
    Password: <input type="password"><br><br>

    Select gender: <br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    Select favorite sport: <br>
    <input type="checkbox"> Basketball
    <input type="checkbox"> Football
    <input type="checkbox"> Golf
    <input type="checkbox"> Tennis<br><br>

    Select favorite junk food: <br>
    <select>
      <option>Kitkat</option>
      <option>Twix</option>
      <option>Snickers</option>
      <option>M&M</option>
    </select><br><br>

    Enter your feedback: <br>
    <textarea>We value your feedback</textarea><br><br>

    <button>log in</button>
    <button type="reset">Clear</button>
     </form>

</body>
</html>
