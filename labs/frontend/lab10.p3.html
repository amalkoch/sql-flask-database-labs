<html>
<head>
<title>Lab 9 - Using div</title>
</head>
<body>
<form>
  <div>First Name: <input type="text"></div><br>
  <div>Last Name: <input type="text"></div><br>
  <div>Password: <input type="password"></div><br>

  <div>
    Select gender:<br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
  </div><br>

  <div>
    Select favorite sport:<br>
    <input type="checkbox"> Basketball
    <input type="checkbox"> Football
    <input type="checkbox"> Golf
    <input type="checkbox"> Tennis
  </div><br>

  <div>
    Select favorite junk food:<br>
    <select>
      <option>Kitkat</option>
      <option>Twix</option>
      <option>Snickers</option>
      <option>M&M</option>
    </select>
  </div><br>

  <div>
    Enter your feedback:<br>
    <textarea>We value your feedback</textarea>
  </div><br>

  <div>
    <button>log in</button>
    <button type="reset">Clear</button>
  </div>
</form>

</body>
</html>
